<body>

  <!-- コメントオーバーレイ（画面またぎ対応・固定） -->
  <div id="commentOverlay" class="comment-overlay"></div>

  <!-- Loading Screen -->
  <div id="loadingScreen" class="screen active">
    <div class="loading-wrap">
      <div class="loading-spinner"></div>
      <p class="loading-text">読み込み中...</p>
    </div>
  </div>

  <!-- Quiz Screen -->
  <div id="quizScreen" class="screen">
    <div class="quiz-container">

      <header class="quiz-header">
        <div class="title-wrap">
          <span id="appTitle" class="app-title"></span>
        </div>
        <span id="timerDisplay" class="timer">残り --秒</span>
      </header>

      <!-- ズーム表示エリア -->
      <div id="zoomContainer" class="zoom-container">
        <canvas id="zoomCanvas" width="360" height="360"></canvas>
        <div id="stepBadge" class="step-badge">STEP 1  今なら10点</div>
      </div>

      <div class="answer-section">
        <input type="text" id="nameInput" class="input-field"
          placeholder="名前（ニックネーム）" maxlength="20" autocomplete="off">
        <input type="text" id="answerInput" class="input-field"
          placeholder="ひらがなかカタカナで解答" maxlength="50"
          autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button id="submitBtn" class="submit-btn">送信</button>
      </div>

      <div id="correctMessage" class="correct-message hidden">正解！</div>
      <div id="correctCount" class="correct-count">正解者: 0人</div>

    </div>
  </div>

  <!-- Result Screen -->
  <div id="resultScreen" class="screen">
    <div class="result-container">
      <h2 class="result-title">TOP3</h2>
      <div id="top3List" class="top3-list"></div>
      <div id="answerReveal" class="answer-reveal"></div>
      <div id="answerImageContainer" class="answer-image-container" style="display:none">
        <img id="answerImage" alt="答え画像">
      </div>
      <div id="nextCountdown" class="next-countdown"></div>
    </div>
  </div>

  <!-- チャット入力（常時表示・固定） -->
  <div class="chat-section">
    <div class="chat-color-wrap">
      <button id="colorToggleBtn" type="button" class="color-toggle-btn" aria-label="コメント色を選ぶ"></button>
      <div id="colorPalette" class="color-palette hidden"></div>
    </div>
    <input type="text" id="chatInput" class="input-field chat-input"
      placeholder="コメント（40文字以内）" maxlength="40" autocomplete="off">
    <button id="chatSendBtn" type="button" class="chat-send-btn">送</button>
  </div>

  <!-- フッター SNS リンク -->
  <footer class="site-footer">
    <span class="footer-label">フォローしてね！＞</span>
    <a href="https://x.com/uko_dayo_" target="_blank" rel="noopener">
      <img src="img/favicon_io/twitter_image.png" alt="Twitter">
    </a>
    <a href="https://t.co/0jAcAV2GJv" target="_blank" rel="noopener">
      <img src="img/favicon_io/discord_image.png" alt="Discord">
    </a>
    <span class="footer-label">＜交流用サーバー！</span>
    <span id="uko-account-status-slot"></span>
  </footer>
